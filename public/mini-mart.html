<!DOCTYPE html>
# mini mart
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Mart - Fresh Groceries</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #f8faf8;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2d6a4f;
    }

    .logo span {
      color: #40916c;
    }

    .search-bar {
      flex: 1;
      max-width: 400px;
      margin: 0 2rem;
    }

    .search-bar input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e8f0e8;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      outline: none;
      border-color: #40916c;
    }

    .cart-btn {
      position: relative;
      background: #2d6a4f;
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: #1b4332;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #d90429;
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-count.hidden {
      display: none;
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 50%, #95d5b2 100%);
      padding: 4rem 2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.5rem;
      color: #1b4332;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.25rem;
      color: #2d6a4f;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Main Content */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Category Filters */
    .categories {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 0.6rem 1.25rem;
      border: 2px solid #d8f3dc;
      background: white;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      color: #2d6a4f;
      transition: all 0.2s;
    }

    .category-btn:hover {
      background: #d8f3dc;
    }

    .category-btn.active {
      background: #2d6a4f;
      color: white;
      border-color: #2d6a4f;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .product-card.hidden {
      display: none;
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #f0f7f0;
    }

    .product-info {
      padding: 1rem;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: #2d6a4f;
      margin-bottom: 1rem;
    }

    .add-to-cart {
      width: 100%;
      padding: 0.75rem;
      background: #40916c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-to-cart:hover {
      background: #2d6a4f;
    }

    /* Cart Drawer */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      z-index: 200;
    }

    .cart-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: white;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 201;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      transform: translateX(0);
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      border-bottom: 1px solid #e8f0e8;
    }

    .cart-header h2 {
      font-size: 1.25rem;
      color: #1a1a1a;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
      padding: 0.25rem;
    }

    .close-cart:hover {
      color: #1a1a1a;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .cart-empty {
      text-align: center;
      color: #666;
      padding: 3rem 1rem;
    }

    .cart-item {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: #f8faf8;
      border-radius: 10px;
      margin-bottom: 0.75rem;
    }

    .cart-item-image {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.25rem;
    }

    .cart-item-price {
      color: #2d6a4f;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #d8f3dc;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .qty-btn:hover {
      background: #d8f3dc;
    }

    .qty-value {
      font-weight: 600;
      min-width: 24px;
      text-align: center;
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid #e8f0e8;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .cart-total span:last-child {
      color: #2d6a4f;
    }

    .checkout-btn {
      width: 100%;
      padding: 1rem;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .checkout-btn:hover {
      background: #1b4332;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .search-bar {
        order: 3;
        margin: 0;
        max-width: 100%;
        width: 100%;
      }

      .hero h1 {
        font-size: 1.75rem;
      }

      .hero p {
        font-size: 1rem;
      }

      .main {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Mini<span>Mart</span></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search groceries...">
    </div>
    <button class="cart-btn" id="openCart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      Cart
      <span class="cart-count hidden" id="cartCount">0</span>
    </button>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Fresh Groceries Delivered</h1>
    <p>Shop quality products at the best prices. Fast delivery to your doorstep.</p>
  </section>

  <!-- Main Content -->
  <main class="main">
    <!-- Category Filters -->
    <div class="categories">
      <button class="category-btn active" data-category="all">All</button>
      <button class="category-btn" data-category="food">Food</button>
      <button class="category-btn" data-category="home">Home</button>
      <button class="category-btn" data-category="care">Care</button>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Cart Overlay -->
  <div class="cart-overlay" id="cartOverlay"></div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-cart" id="closeCart">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
      <p class="cart-empty">Your cart is empty</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout-btn">Checkout</button>
    </div>
  </div>

  <script>
    // Products data
    const products = [
      { id: 1, name: "Organic Bananas", price: 2.99, category: "food", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300&h=200&fit=crop" },
      { id: 2, name: "Fresh Milk 1L", price: 3.49, category: "food", image: "https://images.unsplash.com/photo-1563636619-e9143da7973b?w=300&h=200&fit=crop" },
      { id: 3, name: "Whole Wheat Bread", price: 4.29, category: "food", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300&h=200&fit=crop" },
      { id: 4, name: "Free Range Eggs", price: 5.99, category: "food", image: "https://images.unsplash.com/photo-1582722872445-44dc5f7e3c8f?w=300&h=200&fit=crop" },
      { id: 5, name: "Paper Towels", price: 6.49, category: "home", image: "https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=300&h=200&fit=crop" },
      { id: 6, name: "Dish Soap", price: 3.99, category: "home", image: "https://images.unsplash.com/photo-1585441695325-21557c418b6e?w=300&h=200&fit=crop" },
      { id: 7, name: "Hand Cream", price: 8.99, category: "care", image: "https://images.unsplash.com/photo-1608248597279-f99d160bfcbc?w=300&h=200&fit=crop" },
      { id: 8, name: "Toothpaste", price: 4.49, category: "care", image: "https://images.unsplash.com/photo-1628359355624-855c8e1d4234?w=300&h=200&fit=crop" },
      { id: 9, name: "Fresh Apples", price: 3.79, category: "food", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300&h=200&fit=crop" },
      { id: 10, name: "Laundry Detergent", price: 12.99, category: "home", image: "https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=300&h=200&fit=crop" }
    ];

    // Cart state
    let cart = [];

    // DOM Elements
    const productsGrid = document.getElementById('productsGrid');
    const cartDrawer = document.getElementById('cartDrawer');
    const cartOverlay = document.getElementById('cartOverlay');
    const cartItems = document.getElementById('cartItems');
    const cartCount = document.getElementById('cartCount');
    const cartTotal = document.getElementById('cartTotal');
    const openCartBtn = document.getElementById('openCart');
    const closeCartBtn = document.getElementById('closeCart');
    const categoryBtns = document.querySelectorAll('.category-btn');
    const searchInput = document.getElementById('searchInput');

    // Render products
    function renderProducts(filter = 'all', search = '') {
      productsGrid.innerHTML = '';
      products
        .filter(p => filter === 'all' || p.category === filter)
        .filter(p => p.name.toLowerCase().includes(search.toLowerCase()))
        .forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img src="${product.image}" alt="${product.name}" class="product-image">
            <div class="product-info">
              <h3 class="product-name">${product.name}</h3>
              <p class="product-price">$${product.price.toFixed(2)}</p>
              <button class="add-to-cart" data-id="${product.id}">Add to Cart</button>
            </div>
          `;
          productsGrid.appendChild(card);
        });

      // Add event listeners to add buttons
      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', () => addToCart(parseInt(btn.dataset.id)));
      });
    }

    // Add to cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCart();
    }

    // Update quantity
    function updateQuantity(productId, change) {
      const item = cart.find(item => item.id === productId);
      if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== productId);
        }
      }
      updateCart();
    }

    // Update cart UI
    function updateCart() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      // Update count badge
      cartCount.textContent = totalItems;
      cartCount.classList.toggle('hidden', totalItems === 0);

      // Update total
      cartTotal.textContent = `$${totalPrice.toFixed(2)}`;

      // Render cart items
      if (cart.length === 0) {
        cartItems.innerHTML = '<p class="cart-empty">Your cart is empty</p>';
      } else {
        cartItems.innerHTML = cart.map(item => `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" class="cart-item-image">
            <div class="cart-item-details">
              <p class="cart-item-name">${item.name}</p>
              <p class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</p>
              <div class="quantity-controls">
                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                <span class="qty-value">${item.quantity}</span>
                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    // Toggle cart drawer
    function openCart() {
      cartDrawer.classList.add('open');
      cartOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeCart() {
      cartDrawer.classList.remove('open');
      cartOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    // Event listeners
    openCartBtn.addEventListener('click', openCart);
    closeCartBtn.addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    // Category filter
    let currentCategory = 'all';
    categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderProducts(currentCategory, searchInput.value);
      });
    });

    // Search
    searchInput.addEventListener('input', (e) => {
      renderProducts(currentCategory, e.target.value);
    });

    // Initial render
    renderProducts();
  </script>
</body>
</html>
